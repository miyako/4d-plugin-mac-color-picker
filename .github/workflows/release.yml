# Builds the macOS universal (arm64 + x86_64) plugin, signs and notarizes
# its zip/dmg, then creates a new tag and release from the selected commit.
#
# Manual only: source metadata determines the version; no typed tag input.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: Mac Color Picker
  XCODE_PROJECT: Mac Color Picker.xcodeproj
  MACOS_DEPLOYMENT_TARGET: '11.0'
  # --------------------------------------------------------------

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: set
        name: validate source and check release availability
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$SELECTED_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PLUGINS_DIR="${{ env.PRODUCT_NAME }}.4dbase/Plugins"

          # the repo still tracks an old i386/x86_64 binary in the bundle;
          # remove it so a misplaced build can never be packaged instead
          rm -rf "$PLUGINS_DIR/${{ env.PRODUCT_NAME }}.bundle/Contents/MacOS"
          rm -rf "$PLUGINS_DIR/Default"

          # write the product straight into Plugins/, not Plugins/Default/
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="${{ env.PRODUCT_NAME }}.4dbase/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN - CONFIGURATION_BUILD_DIR mismatch?"
            ls -R "${{ env.PRODUCT_NAME }}.4dbase/Plugins"
            exit 1
          fi
          lipo -info "$BIN"
          # separate commands: an a && b list does not trip set -e
          lipo -info "$BIN" | grep -q "arm64"
          lipo -info "$BIN" | grep -q "x86_64"
          if lipo -info "$BIN" | grep -q "i386"; then
            echo "::error::i386 slice found - this is a stale binary, not the fresh build"
            exit 1
          fi
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"
          # show hardened runtime (flags=0x10000(runtime)), timestamp and authority
          codesign -dv --verbose=4 "$BUNDLE_PATH" 2>&1 | grep -E "Format|Authority|Timestamp|flags|TeamIdentifier"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: the freshly built macOS bundle
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          # submit and wait; on anything but Accepted, print Apple's log and fail
          notarize() {
            local OUT ID STATUS
            OUT=$(xcrun notarytool submit "$1" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" \
              --wait --output-format json) || true
            echo "$OUT"
            ID=$(plutil -extract id raw -o - - <<< "$OUT" 2>/dev/null || true)
            STATUS=$(plutil -extract status raw -o - - <<< "$OUT" 2>/dev/null || true)
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $1 returned '${STATUS:-no status}'"
              if [ -n "$ID" ]; then
                xcrun notarytool log "$ID" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" || true
              fi
              return 1
            fi
          }

          notarize "$ZIP_PATH"
          notarize "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: recheck availability and create tag, release and assets
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$SELECTED_SHA" "$ZIP_PATH" "$DMG_PATH"
